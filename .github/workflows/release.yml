name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-appimage:
    name: Linux AppImage (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            gstreamer1.0-tools \
            libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/package-linux-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Citadel_CCTV-linux-x86_64
          path: |
            dist/Citadel_CCTV-linux-x86_64.AppImage
            dist/Citadel_CCTV-linux-x86_64.AppImage.sha256

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Citadel_CCTV-linux-x86_64.AppImage
            dist/Citadel_CCTV-linux-x86_64.AppImage.sha256
          generate_release_notes: true
          body: |
            **Linux:** `chmod +x Citadel_CCTV-linux-x86_64.AppImage` and run it.
            Put `cameras.toml` next to the AppImage, or in `~/.config/citadel-cctv/`.
            Copy `cameras.example.toml` from inside the image (`usr/share/citadel-cctv/`) if you need a template.

            **Windows:** still built with `.\scripts\build-release.ps1` (or `make windows` from Linux) and attached separately if you have a ZIP.
