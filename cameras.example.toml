# Copy to cameras.toml and edit. cameras.toml is gitignored — do not commit it.
# Direct RTSP (no NVR) — leave [nvr] out.
[[cameras]]
id = "example_cam"
name = "Example Camera"
url = "rtsp://user:password@192.0.2.10:554/Streaming/Channels/102"

# --- OR discover / stream via Hikvision NVR ---
# [nvr]
# enabled = false   # keep credentials but use [[cameras]] URLs only
# host = "198.51.100.20"
# http_port = 49000
# rtsp_port = 49002   # remapped RTSP; default device port is 554
# https_port = 49003  # remapped HTTPS; default 443
# server_port = 49001 # Hikvision SDK (“Server Port”); default 8000
# username = "admin"
# password = "changeme"
# stream = "sub"   # main | sub | third  (default: sub)
# protocols = "tcp"  # udp | tcp | udp+tcp — pin for all NVR streams
# Default decode is software (avdec_*). Set env RUSTCAMS_DECODE=hw for DXVA.
#
# Listed cameras keep stable ids for views.toml. Match by host + lens in url
# (/Streaming/Channels/101 → lens 1, …/201 → lens 2), or set channel = N.
# Grid panes use the NVR; url is for fullscreen direct. PTZ uses NVR ISAPI.
#
# [[cameras]]
# id = "front"
# name = "Front"
# url = "rtsp://admin:camera-password@192.0.2.10:554/Streaming/Channels/201"
#
# [[cameras]]
# id = "front_ptz"
# name = "Front PTZ"
# url = "rtsp://admin:camera-password@192.0.2.10:554/Streaming/Channels/102"
#
# PTZ is on for every camera. Set ptz = false to disable.
# [[cameras]]
# id = "yard"
# name = "Yard"
# url = "rtsp://admin:camera-password@203.0.113.50:554/Streaming/Channels/102"
# ptz = true

[viewer]
app_name = "Citadel CCTV"
default_layout = "3x3"
default_fit = "contain"  # contain | cover | fill
pause_when_unfocused = true

# Hikvision Access Control (toolbar Gates / DualShock L1, then confirm).
# [gate]
# host = "203.0.113.80"
# http_port = 80
# username = "admin"
# password = "changeme"

# Hikvision ANPR watchlist (Settings → ANPR). Listens to alertStream.
# [anpr]
# enabled = true
# host = "203.0.113.90"
# http_port = 80
# username = "admin"
# password = "changeme"
# silent = false
# channel = 1
#
# [[anpr.plates]]
# plate = "AB12CDE"
# name = "Example"
# enabled = true
# sound = "alert"   # builtin: alert | kim  (or a path to an .mp3)
